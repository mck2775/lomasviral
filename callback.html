<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization - Lomasviral</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  body { font: 16px/1.6 system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  code, textarea { font: 14px/1.4 ui-monospace, monospace; }
  textarea { width: 100%; height: 5rem; }
  .ok { color: #137333; } .err { color: #b3261e; }
  a { color: #0b57d0; }
</style>
</head>
<body>
<h1>Lomasviral authorization</h1>
<p id="status">Checking the response from TikTok...</p>
<div id="result" hidden>
  <p>Copy this authorization code into the Lomasviral data notebook. It is single-use and expires within minutes.</p>
  <textarea id="code" readonly></textarea>
  <p><button id="copy" type="button">Copy code</button></p>
</div>
<p><a href="index.html">Back</a> &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a></p>
<script>
  var params = new URLSearchParams(window.location.search);
  var msg = document.getElementById("status");
  var expected = null;
  try { expected = sessionStorage.getItem("tt_state"); } catch (e) {}

  if (params.get("error")) {
    msg.className = "err";
    msg.textContent = "TikTok returned an error: " + params.get("error") +
      (params.get("error_description") ? " - " + params.get("error_description") : "");
  } else if (!params.get("code")) {
    msg.textContent = "No authorization code found. Start from the home page and press Connect TikTok.";
  } else if (!expected || params.get("state") !== expected) {
    msg.className = "err";
    msg.textContent = "The state value does not match this browser session, so the code was not shown. Start again from the home page.";
    } else {
    try { sessionStorage.removeItem("tt_state"); } catch (e) {}
    msg.className = "ok";
    msg.textContent = "Autorización recibida. Conectando con Lomasviral...";
    var target = "https://lomasviral-publish-7474644109457991.aws.databricksapps.com/callback?code=" +
      encodeURIComponent(params.get("code"));
    window.location.replace(target);
  }
</script>
</body>
</html>
